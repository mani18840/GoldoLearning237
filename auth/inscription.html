<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - GoldoLearning237</title>
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">GoldoLearning<span>237</span></div>
        <h1>Créer un compte</h1>
        <p class="auth-subtitle">Rejoins la plateforme en tant qu'étudiant, enseignant ou promoteur.</p>

        <form id="inscriptionForm">
            <div class="form-group">
                <label for="role">Je suis</label>
                <select id="role" name="role" required>
                    <option value="" disabled selected>Choisissez un rôle</option>
                    <option value="etudiant">Étudiant</option>
                    <option value="enseignant">Enseignant</option>
                    <option value="promoteur">Promoteur</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nom">Nom complet</label>
                <input type="text" id="nom" name="nom" placeholder="Ex : Mani Awono Eloundou Igor" required>
            </div>

            <div class="form-group" id="matriculeGroup" style="display:none;">
                <label for="matricule">Matricule</label>
                <input type="text" id="matricule" name="matricule" placeholder="Ex : 23V2144">
            </div>

            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="8 caractères minimum" required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Retapez le mot de passe" required minlength="8">
            </div>

            <p class="form-error" id="formError"></p>

            <button type="submit" class="btn-auth-primary" id="submitBtn">S'inscrire</button>
        </form>

        <p class="auth-footer">
            Déjà un compte ? <a href="login.html">Se connecter</a>
        </p>
    </div>
</div>

<script>
const roleSelect = document.getElementById("role");
const matriculeGroup = document.getElementById("matriculeGroup");
const matriculeInput = document.getElementById("matricule");

// Le matricule n'est requis que pour les étudiants
roleSelect.addEventListener("change", () => {
    if (roleSelect.value === "etudiant") {
        matriculeGroup.style.display = "block";
        matriculeInput.required = true;
    } else {
        matriculeGroup.style.display = "none";
        matriculeInput.required = false;
        matriculeInput.value = "";
    }
});

const form = document.getElementById("inscriptionForm");
const formError = document.getElementById("formError");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    formError.textContent = "";

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        formError.textContent = "Les mots de passe ne correspondent pas.";
        return;
    }

    const payload = {
        role: roleSelect.value,
        nom: document.getElementById("nom").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: password,
        matricule: matriculeInput.value.trim() || null
    };

    submitBtn.disabled = true;
    submitBtn.textContent = "Inscription en cours...";

    try {
        const res = await fetch("../api/auth.php?action=inscription", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
            window.location.href = "login.html?inscription=succes";
        } else {
            formError.textContent = data.message || "Erreur lors de l'inscription.";
        }
    } catch (err) {
        formError.textContent = "Erreur de connexion au serveur.";
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "S'inscrire";
    }
});
</script>

</body>
</html>
